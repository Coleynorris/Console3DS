# Console3DS - Mosquitto 2.x config (laptop broker)
# The Windows service reads C:\Program Files\mosquitto\mosquitto.conf,
# so copy this file over that one (admin), then restart the service.

# Accept connections from the network (ESP32 on the Mobile Hotspot), not just localhost
listener 1883

# School project, plain MQTT, no username/password
allow_anonymous true

# Keep retained messages (game/state/ui, console/status) across broker restarts
persistence true
persistence_location C:\Program Files\mosquitto\data\

# The service has no console, so log to a file (open it if the service won't start)
log_dest file C:\Program Files\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
